<div id="root"></div>
<script>
(function(){
  function norm(s){
    return (s||'').toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
  }

  var SERVICE_LABELS = {
    renovacao: ['renovar minha cnh','renovar cnh'],
    segunda_via: ['emitir segunda via','segunda via'],
    primeira_via: ['primeira via nunca tive cnh','primeira via'],
    definitiva: ['cnh definitiva','definitiva'],
    adicao_categoria: ['adicionar categoria','adicao categoria']
  };

  function detectServiceFromText(txt){
    var t = norm(txt);
    if (!t) return '';
    if (t === 'renovar minha cnh' || t === 'renovar cnh') return 'renovacao';
    if (t === 'emitir segunda via' || t === 'segunda via') return 'segunda-via';
    if (t === 'primeira via nunca tive cnh' || t === 'primeira via') return 'primeira-via';
    if (t === 'cnh definitiva' || t === 'definitiva') return 'definitiva';
    if (t === 'adicionar categoria' || t === 'adicao categoria') return 'adicao-categoria';
    return '';
  }

  function isServiceChoiceText(txt){
    var t = norm(txt);
    return t === 'renovar minha cnh' ||
      t === 'emitir segunda via' ||
      t === 'primeira via nunca tive cnh' ||
      t === 'cnh definitiva' ||
      t === 'adicionar categoria';
  }

  function setPrimeiraViaSkipFlag(v){
    try { sessionStorage.setItem('primeira_via_skip_categoria', v ? '1' : '0'); } catch(e) {}
  }

  function shouldSkipPrimeiraViaCategoria(){
    try { return sessionStorage.getItem('primeira_via_skip_categoria') === '1'; } catch(e) { return false; }
  }

  function getService(){
    try {
      var s = localStorage.getItem('selectedService') || '';
      if (s) return s;
      var ud = localStorage.getItem('userData');
      if (ud){
        var obj = JSON.parse(ud);
        if (obj && obj.tipoServico) return obj.tipoServico;
      }
    } catch(e) {}
    return '';
  }

  function saveService(s){
    if (!s) return;
    try {
      localStorage.setItem('selectedService', s);
      var ud = localStorage.getItem('userData');
      var obj = ud ? JSON.parse(ud) : {};
      obj = obj || {};
      obj.tipoServico = s;
      localStorage.setItem('userData', JSON.stringify(obj));
    } catch(e) {}
  }

  function isCategoryCardPresent(){
    var txt = norm(document.body.innerText || '');
    return txt.indexOf('nao possuo cnh') >= 0 && txt.indexOf('categoria a') >= 0;
  }

  function getOptionElements(){
    var nodes = Array.prototype.slice.call(document.querySelectorAll('button, [role="button"], div, li, p, span'));
    return nodes.filter(function(el){
      if (!el || !el.innerText) return false;
      var t = norm(el.innerText);
      if (!t) return false;
      if (t === 'nao possuo cnh') return true;
      if (t.indexOf('possuo cnh categoria a') === 0) return true;
      if (t.indexOf('possuo cnh categoria b') === 0) return true;
      if (t.indexOf('possuo cnh categoria ab') === 0) return true;
      return false;
    });
  }

  var primeiraViaAutoDone = false;
  var primeiraViaSubmitDone = false;

  function isVisible(el){
    if (!el) return false;
    if (!el.offsetParent && el !== document.body) return false;
    var st = window.getComputedStyle ? window.getComputedStyle(el) : null;
    if (!st) return true;
    return st.display !== 'none' && st.visibility !== 'hidden' && st.opacity !== '0';
  }

  function findNaoPossuoClickable(){
    var options = getOptionElements();
    for (var i = 0; i < options.length; i++) {
      var el = options[i];
      if (norm(el.innerText) !== 'nao possuo cnh') continue;
      var row = el.closest('button,[role="button"],div,li') || el;
      if (!isVisible(row)) continue;
      return row;
    }
    return null;
  }

  function maybeAutoAdvancePrimeiraVia(){
    var service = getService();
    var shouldSkip = service === 'primeira-via' || shouldSkipPrimeiraViaCategoria();
    if (!shouldSkip) {
      primeiraViaAutoDone = false;
      primeiraViaSubmitDone = false;
      return;
    }
    if (primeiraViaAutoDone) return;
    if (!isCategoryCardPresent()) return;

    var target = findNaoPossuoClickable();
    if (!target) return;

    primeiraViaAutoDone = true;
    target.click();
  }

  function findConfirmButton(){
    var nodes = Array.prototype.slice.call(document.querySelectorAll('button, [role="button"], div, span, p, a'));
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (!el || !el.innerText) continue;
      if (norm(el.innerText) !== 'confirmar') continue;
      var row = el.closest('button,[role="button"],a,div') || el;
      if (!isVisible(row)) continue;
      return row;
    }
    return null;
  }

  function maybeAutoSubmitPrimeiraVia(){
    var service = getService();
    var shouldSkip = service === 'primeira-via' || shouldSkipPrimeiraViaCategoria();
    if (!shouldSkip) {
      primeiraViaSubmitDone = false;
      return;
    }
    if (primeiraViaSubmitDone) return;
    if (!isCategoryCardPresent()) return;

    var btn = findConfirmButton();
    if (!btn) return;

    primeiraViaSubmitDone = true;
    setPrimeiraViaSkipFlag(false);
    btn.click();
  }

  function applyCategoryRules(){
    if (!isCategoryCardPresent()) return;
    var service = getService();
    if (!service) return;

    var options = getOptionElements();
    if (!options.length) return;

    options.forEach(function(el){
      var t = norm(el.innerText);
      var isNaoPossuo = (t === 'nao possuo cnh');
      var hide = false;

      if (service === 'renovacao' || service === 'segunda-via' || service === 'definitiva' || service === 'adicao-categoria') {
        hide = isNaoPossuo;
      }
      if (service === 'primeira-via') {
        hide = !isNaoPossuo;
      }

      var row = el.closest('button,[role="button"],div,li') || el;
      if (row && row.style) {
        row.style.display = hide ? 'none' : '';
      }
    });

    if (service === 'primeira-via' || shouldSkipPrimeiraViaCategoria()) {
      setTimeout(maybeAutoAdvancePrimeiraVia, 50);
      setTimeout(maybeAutoSubmitPrimeiraVia, 120);
    }
  }

  function ensureBackButton(){
    return;
  }

  function _flowNoop(){
  }

  document.addEventListener('click', function(ev){
    var el = ev.target && (ev.target.closest ? ev.target.closest('button,[role="button"],div,span,p,li') : null);
    if (!el) return;

    var txt = el.innerText || '';
    if (isServiceChoiceText(txt)) {
      var s = detectServiceFromText(txt);
      if (s) {
        saveService(s);
        setPrimeiraViaSkipFlag(s === 'primeira-via');
        primeiraViaAutoDone = false;
        primeiraViaSubmitDone = false;
      }
    }

    setTimeout(applyCategoryRules, 60);
  }, true);

  var mo = new MutationObserver(function(){
    applyCategoryRules();
  });

  function start(){
    applyCategoryRules();
    mo.observe(document.documentElement || document.body, { childList:true, subtree:true });
    setInterval(applyCategoryRules, 1000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
